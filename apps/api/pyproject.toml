[project]
name = "insightflow-api"
version = "1.0.0"
description = "InsightFlow AI FastAPI Backend"
requires-python = ">=3.11"

[tool.vercel]
entrypoint = "main:app"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning"
]
